<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betongkalkylator</title>
<meta name="description" content="Volym, bilar och gjuttid för en gjutetapp.">
<style>
  :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; --a: #5b8cff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0d12; color: #e7e9ef; display: grid; place-items: start center; padding: 32px 16px; }
  .wrap { width: min(860px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  h1 { grid-column: 1 / -1; font-size: 20px; margin: 0; }
  h1 small { display: block; font-size: 13px; color: #7d8597; font-weight: 400; margin-top: 4px; }
  .card { background: #11141b; border: 1px solid #ffffff14; border-radius: 14px; padding: 18px; }
  label { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: #b4bac8; }
  input { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #ffffff1f; background: #0e1117; color: #fff; font: inherit; text-align: right; }
  input:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px #5b8cff26; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; }
  .big small { font-size: 16px; color: #7d8597; font-weight: 500; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ffffff10; font-size: 14px; }
  .row b { font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 9px; background: #1a1f2a; overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #5b8cff, #3ecf8e); transition: width .2s; }
  .note { color: #7d8597; font-size: 12px; margin-top: 12px; line-height: 1.5; }
  @media (max-width: 640px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Betongkalkylator<small>Volym, antal bilar och gjuttid för en gjutetapp</small></h1>
    <div class="card">
      <label>Längd (m) <input id="l" type="number" value="24" step="0.1"></label>
      <label>Bredd (m) <input id="w" type="number" value="12" step="0.1"></label>
      <label>Tjocklek (m) <input id="t" type="number" value="0.6" step="0.05"></label>
      <label>Spill (%) <input id="s" type="number" value="4" step="0.5"></label>
      <label>Bil (m³/st) <input id="c" type="number" value="7" step="0.5"></label>
      <label>Pumpkapacitet (m³/h) <input id="p" type="number" value="28" step="1"></label>
      <label>Starttid <input id="st" type="time" value="06:30"></label>
    </div>
    <div class="card">
      <div class="big" id="vol">–</div>
      <div class="row"><span>Antal bilar</span><b id="trucks">–</b></div>
      <div class="row"><span>Gjuttid</span><b id="time">–</b></div>
      <div class="row"><span>Beräknat klart</span><b id="end">–</b></div>
      <div class="row"><span>Bilintervall</span><b id="int">–</b></div>
      <div class="bar"><i id="fill"></i></div>
      <p class="note">Senaste värden sparas i det här verktygets egen lagring. Verktyget körs isolerat från Project Control Hub.</p>
    </div>
  </div>
  <script>
    var ids = ['l', 'w', 't', 's', 'c', 'p', 'st'];
    var store = null; try { store = window.localStorage; store.getItem('x'); } catch (e) { store = null; }
    try { var saved = JSON.parse((store && store.getItem('concrete')) || '{}'); ids.forEach(function (k) { if (saved[k] != null) document.getElementById(k).value = saved[k]; }); } catch (e) {}
    function v(id) { return parseFloat(document.getElementById(id).value) || 0; }
    function calc() {
      var vol = v('l') * v('w') * v('t') * (1 + v('s') / 100);
      var trucks = Math.ceil(vol / Math.max(0.1, v('c')));
      var hours = vol / Math.max(0.1, v('p'));
      var st = (document.getElementById('st').value || '06:30').split(':').map(Number);
      var endMin = st[0] * 60 + st[1] + Math.round(hours * 60);
      document.getElementById('vol').innerHTML = vol.toFixed(1) + ' <small>m³</small>';
      document.getElementById('trucks').textContent = trucks + ' st';
      document.getElementById('time').textContent = Math.floor(hours) + ' h ' + Math.round((hours % 1) * 60) + ' min';
      document.getElementById('end').textContent = String(Math.floor(endMin / 60) % 24).padStart(2, '0') + ':' + String(endMin % 60).padStart(2, '0');
      document.getElementById('int').textContent = trucks > 1 ? Math.round(hours * 60 / trucks) + ' min' : '–';
      document.getElementById('fill').style.width = Math.min(100, hours / 10 * 100) + '%';
      var o = {}; ids.forEach(function (k) { o[k] = document.getElementById(k).value; });
      try { store && store.setItem('concrete', JSON.stringify(o)); } catch (e) {}
    }
    ids.forEach(function (k) { document.getElementById(k).addEventListener('input', calc); });
    calc();
  </script>
</body>
</html>
